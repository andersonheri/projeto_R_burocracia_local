name: setor_politica
instructions: Classifique em qual area empirica de politica publica o artigo situa
  o caso estudado (o CAMPO DE ATUACAO da burocracia analisada, nao a teoria mobilizada).
  Baseie-se no que o titulo e o abstract descrevem como objeto empirico.
multilabel: no
lang: pt
mode: manual
created_at: 2026-08-06 17:07:43
history: []
categories:
  saude:
    name: saude
    definition: Caso estudado em politicas ou servicos de saude (SUS, agentes de saude,
      vigilancia sanitaria, etc.).
    examples_pos: Analisamos o desempenho de agentes comunitarios de saude em municipios
      do Nordeste.
    examples_neg: []
    references: []
    weight: 1.0
    concept: ~
    literature: ~
  educacao:
    name: educacao
    definition: Caso estudado em politicas ou servicos educacionais (professores,
      gestao escolar, redes municipais de ensino).
    examples_pos: O artigo examina a autonomia de diretores escolares na rede municipal
      de ensino.
    examples_neg: []
    references: []
    weight: 1.0
    concept: ~
    literature: ~
  assistencia_social:
    name: assistencia_social
    definition: Caso estudado em assistencia social (CRAS, CREAS, Bolsa Familia, burocracia
      do SUAS).
    examples_pos: Investigamos a atuacao de assistentes sociais no CRAS de municipios
      paulistas.
    examples_neg: []
    references: []
    weight: 1.0
    concept: ~
    literature: ~
  gestao_fiscal_administrativa_geral:
    name: gestao_fiscal_administrativa_geral
    definition: Caso estudado em gestao fiscal, administrativa ou de pessoal do municipio,
      sem foco em um setor social especifico.
    examples_pos: O estudo compara a capacidade administrativa e fiscal de secretarias
      municipais de administracao.
    examples_neg: Analisamos o desempenho de agentes comunitarios de saude em municipios
      do Nordeste.
    references: []
    weight: 1.0
    concept: ~
    literature: ~
  meio_ambiente_infraestrutura:
    name: meio_ambiente_infraestrutura
    definition: Caso estudado em meio ambiente, saneamento, mobilidade ou infraestrutura
